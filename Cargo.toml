[workspace]
members = ["server", "wasm", "crates/ironrdp-rail"]
resolver = "2"

# Optimized release builds for both the server and the WASM decoder.
# LTO + a single codegen unit give the biggest win for the decode-heavy
# WASM hot loop; panic=abort also shrinks the WASM binary (faster first load).
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[patch."https://github.com/Devolutions/IronRDP.git"]
# Git patch (shipping): pinned to a specific fork commit for reproducible
# builds off this machine (e.g. the Windows VM). To iterate on the fork
# locally instead, comment these out and use the local-path patch below
# (see ../rdp-reference/IronRDP-fork and scripts/ dev notes).
ironrdp-session = { git = "https://github.com/amartyaa/IronRDP.git", rev = "bf5b017d41cfce4003e0aa01a20c834e75f3f29f" }
ironrdp         = { git = "https://github.com/amartyaa/IronRDP.git", rev = "bf5b017d41cfce4003e0aa01a20c834e75f3f29f" }
ironrdp-core    = { git = "https://github.com/amartyaa/IronRDP.git", rev = "bf5b017d41cfce4003e0aa01a20c834e75f3f29f" }
ironrdp-cliprdr-format = { git = "https://github.com/amartyaa/IronRDP.git", rev = "bf5b017d41cfce4003e0aa01a20c834e75f3f29f" }
# Local-path patch (fork dev):
# ironrdp-session = { path = "../rdp-reference/IronRDP-fork/crates/ironrdp-session" }
# ironrdp = { path = "../rdp-reference/IronRDP-fork/crates/ironrdp" }
# ironrdp-core = { path = "../rdp-reference/IronRDP-fork/crates/ironrdp-core" }
# ironrdp-cliprdr-format = { path = "../rdp-reference/IronRDP-fork/crates/ironrdp-cliprdr-format" }
ironrdp-rdpsnd = { path = "crates/ironrdp-rdpsnd" }
[patch."https://github.com/amartyaa/IronRDP.git"]
ironrdp-rdpsnd = { path = "crates/ironrdp-rdpsnd" }