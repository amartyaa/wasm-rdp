[package]
name = "ironrdp-rdpsnd"
version = "0.7.0"
description = "RDPSND static channel for audio output implemented as described in MS-RDPEA"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"

[lib]
doctest = false
test = false

[features]
default = []
std = []

[dependencies]
bitflags = "2.11"
tracing = { version = "0.1", features = ["log"] }
# Pinned by `rev` (not `branch`) to match the root Cargo.toml's [patch] pin —
# a branch ref and a rev ref to the identical commit are still different
# Cargo SourceIds, which duplicates ironrdp-svc/-dvc/-core/-pdu in the
# dependency graph and breaks trait bounds (SvcClientProcessor/DvcProcessor
# "not satisfied" errors). Update this rev whenever the root pin changes.
ironrdp-svc = { git = "https://github.com/amartyaa/IronRDP.git", rev = "6b189b9c195ffba74b912bebdd4c6b6d2d8038f8", version = "0.6" }
ironrdp-dvc = { git = "https://github.com/amartyaa/IronRDP.git", rev = "6b189b9c195ffba74b912bebdd4c6b6d2d8038f8", version = "0.5" }
ironrdp-core = { git = "https://github.com/amartyaa/IronRDP.git", rev = "6b189b9c195ffba74b912bebdd4c6b6d2d8038f8", version = "0.1", features = ["alloc"] }
ironrdp-pdu = { git = "https://github.com/amartyaa/IronRDP.git", rev = "6b189b9c195ffba74b912bebdd4c6b6d2d8038f8", version = "0.7", features = ["alloc"] }
